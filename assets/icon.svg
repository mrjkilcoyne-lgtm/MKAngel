<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#b8d4f0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4e6f7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7ba7cc;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#0f1b2d"/>
  <!-- Outer glow -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)"/>
  <!-- Left wing -->
  <path d="M 256 200 Q 180 160 120 220 Q 140 260 180 280 Q 210 250 256 240 Z"
        fill="url(#wing)" opacity="0.8"/>
  <!-- Right wing -->
  <path d="M 256 200 Q 332 160 392 220 Q 372 260 332 280 Q 302 250 256 240 Z"
        fill="url(#wing)" opacity="0.8"/>
  <!-- Body/core -->
  <ellipse cx="256" cy="280" rx="30" ry="60" fill="#e8f0f8" opacity="0.9"/>
  <!-- Head -->
  <circle cx="256" cy="210" r="28" fill="#f0f6fc"/>
  <!-- Halo -->
  <ellipse cx="256" cy="175" rx="40" ry="12" fill="none"
           stroke="#ffd700" stroke-width="3" opacity="0.8"/>
  <!-- Grammar lines (connecting nodes) -->
  <g stroke="#7ba7cc" stroke-width="1.5" opacity="0.5">
    <line x1="160" y1="350" x2="200" y2="380"/>
    <line x1="200" y1="380" x2="256" y2="360"/>
    <line x1="256" y1="360" x2="312" y2="380"/>
    <line x1="312" y1="380" x2="352" y2="350"/>
    <line x1="256" y1="360" x2="256" y2="400"/>
    <line x1="200" y1="380" x2="220" y2="420"/>
    <line x1="312" y1="380" x2="292" y2="420"/>
  </g>
  <!-- Grammar nodes -->
  <g fill="#b8d4f0">
    <circle cx="160" cy="350" r="5"/>
    <circle cx="200" cy="380" r="5"/>
    <circle cx="256" cy="360" r="6"/>
    <circle cx="312" cy="380" r="5"/>
    <circle cx="352" cy="350" r="5"/>
    <circle cx="256" cy="400" r="4"/>
    <circle cx="220" cy="420" r="4"/>
    <circle cx="292" cy="420" r="4"/>
  </g>
  <!-- Text -->
  <text x="256" y="470" text-anchor="middle" fill="#b8d4f0"
        font-family="serif" font-size="32" font-weight="bold">MKAngel</text>
</svg>
